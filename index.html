<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Polly Contact Directory</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Polly <span>Directory</span></div>
    <div class="global-search-wrap">
      <input type="text" id="globalSearch" class="global-search-input" placeholder="Search everything — carriers, internal, agents…" autocomplete="off" />
    </div>
    <nav class="tab-nav" id="mainNav">
      <button class="tab-btn active" data-tab="carriers">Carriers</button>
      <button class="tab-btn" data-tab="internal">Internal</button>
      <button class="tab-btn" data-tab="agents">Franchise Agents</button>
    </nav>
  </div>
</header>

<main>

  <!-- GLOBAL SEARCH RESULTS -->
  <section id="tab-search" class="tab-section" style="display:none">
    <p class="result-count" id="globalCount"></p>
    <div id="searchCarriersWrap">
      <div class="search-group-heading">Carriers</div>
      <div class="card-grid" id="searchCarrierGrid"></div>
    </div>
    <div id="searchInternalWrap">
      <div class="search-group-heading">Internal Contacts</div>
      <div id="searchInternalResults" class="internal-grid" style="margin-bottom:24px"></div>
    </div>
    <div id="searchAgentsWrap">
      <div class="search-group-heading">Franchise Agents</div>
      <div class="agent-grid" id="searchAgentGrid"></div>
    </div>
    <p class="no-results" id="globalNoResults" style="display:none">No results found.</p>
  </section>

  <!-- CARRIERS TAB -->
  <section id="tab-carriers" class="tab-section active">
    <p class="result-count" id="carrierCount"></p>
    <div class="card-grid" id="carrierGrid"></div>
    <p class="no-results" id="carrierNoResults" style="display:none">No carriers match your search.</p>
  </section>

  <!-- INTERNAL TAB -->
  <section id="tab-internal" class="tab-section">
    <h2 class="section-heading">Polly Internal Contacts</h2>
    <div class="quick-grid" id="internalQuick"></div>
    <div id="internalGroups"></div>
  </section>

  <!-- FRANCHISE AGENTS TAB -->
  <section id="tab-agents" class="tab-section">
    <h2 class="section-heading">Polly Franchise Agents</h2>
    <div id="agentGroups"></div>
    <p class="no-results" id="agentNoResults" style="display:none">No agents found.</p>
  </section>

</main>

<!-- CARRIER DETAIL MODAL -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
